name: kostin-artem-student-api

services:
  app:
    build: .
    image: kostin-artem-student-api:v1.0-kostin-artem
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-studentdb}
      DB_USERNAME: ${POSTGRES_USER:-studentuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - student-network

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studentdb}
      POSTGRES_USER: ${POSTGRES_USER:-studentuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - student-network

volumes:
  postgres-data:

networks:
  student-network:
